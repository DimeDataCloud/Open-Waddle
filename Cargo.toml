[workspace]
resolver = "2"
members = ["crates/waddle-core", "src-tauri"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/DimeDataCloud/Waddle"

[workspace.dependencies]
waddle-core = { path = "crates/waddle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
