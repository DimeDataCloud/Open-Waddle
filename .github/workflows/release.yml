name: Release

# Push a tag like v0.2.9 to build the Windows installers and attach them to a
# draft GitHub release, along with latest.json, which installed copies read to
# find updates. Check the draft, then publish it by hand.
#
# Needs two repository secrets (see CONTRIBUTING.md): TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, from `tauri signer generate`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installer (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
          - arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
      - name: Build and sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: waddle-windows-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  manifest:
    name: Update manifest (latest.json)
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: waddle-windows-*
          path: installers
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write latest.json
        run: |
          node scripts/make-latest-json.mjs installers "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "Release notes at https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/latest.json
