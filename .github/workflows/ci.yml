name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libxcb1-dev libxrandr-dev libdbus-1-dev libegl-dev \
            libwayland-dev libgbm-dev libasound2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-arm64:
    name: Build installer (Windows ARM64)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: waddle-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
