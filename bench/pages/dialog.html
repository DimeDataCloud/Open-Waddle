<!doctype html><html><head><meta charset="utf-8"><title>Notepad</title><link rel="stylesheet" href="common.css"><style>
body{background:#3a6ea5}
.np{position:absolute;left:180px;top:90px;width:1000px;height:700px;background:#fff;box-shadow:0 8px 30px #0006;border-radius:8px;overflow:hidden}

.dlg button{min-width:110px;height:32px;border-radius:4px;border:1px solid #ccc;background:#fff}.dlg button.p{background:#005fb8;color:#fff;border-color:#005fb8}
