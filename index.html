<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waddle</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" class="bubble hidden" aria-live="polite">
      <div class="lines"></div>
      <button class="stop hidden" title="Stop (Esc)">■ Stop</button>
    </div>
    <div id="approval" class="card hidden" role="dialog" aria-label="Approval needed"></div>
    <section id="history" class="drawer hidden" role="dialog" aria-label="Conversation" tabindex="-1">
      <header>
        <strong>Conversation</strong>
        <button type="button" class="clear" title="Forget the conversation (Waddle's memory of it too)">Forget</button>
        <button type="button" class="close" title="Close (Esc)" aria-label="Close">✕</button>
      </header>
      <div class="entries" tabindex="0" aria-live="polite"></div>
    </section>
    <button id="badge" class="badge hidden" type="button" title="Waddle has something for you">!</button>
    <form id="chat" class="chat hidden" autocomplete="off">
      <div class="chip hidden"><span></span><button type="button" title="Don't send the selection">✕</button></div>
      <textarea id="chat-input" rows="1" placeholder="Ask Waddle…" spellcheck="true" aria-label="Message to Waddle (Enter sends, Shift+Enter for a new line, ↑ for earlier messages)"></textarea>
      <button type="button" id="history-btn" title="Conversation (Ctrl+Alt+H)" aria-label="Conversation history">🕘</button>
      <button type="button" id="mic" title="Talk (Ctrl+Alt+Space)" aria-label="Talk">🎙</button>
      <button type="submit" id="send" title="Send (Enter)" aria-label="Send">➤</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
